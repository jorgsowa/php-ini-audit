name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -t . -v
      - name: CLI smoke test
        run: |
          php-ini-audit --version
          php-ini-audit rules > /dev/null
          php-ini-audit tests/fixtures/hardened/php.ini --fail-on low
          php-ini-audit --root tests/fixtures/debian --format sarif -o report.sarif
          python -c "import json; assert json.load(open('report.sarif'))['runs'][0]['results']"

  php-parity:
    name: Parity with PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install php-cgi
        run: |
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends php${{ matrix.php }}-cgi
      - name: Parity tests
        env:
          PHP_CGI: /usr/bin/php-cgi${{ matrix.php }}
          PYTHONPATH: src
        run: python -m unittest tests.test_php_parity -v

  docker-images:
    name: Real PHP images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Scan official, Alpine and Debian images
        env:
          PHP_INI_AUDIT_DOCKER: "1"
          PYTHONPATH: src
        run: python -m unittest tests.test_docker_images -v
