name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
        include:
          - os: macos-latest
            php: "8.5"
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        run: composer install --no-progress
      # setup-php installs php-cgi; parity runs only in the dedicated job.
      - name: Unit and integration tests
        run: vendor/bin/phpunit --exclude-group parity
      - name: CLI smoke test
        run: |
          bin/php-ini-audit --version
          bin/php-ini-audit rules > /dev/null
          bin/php-ini-audit tests/fixtures/hardened/php.ini --fail-on low
          bin/php-ini-audit --root tests/fixtures/debian --format sarif -o report.sarif
          php -r '$r = json_decode(file_get_contents("report.sarif"), true); exit($r["runs"][0]["results"] ? 0 : 1);'
      - name: PHAR smoke test
        run: |
          php -d phar.readonly=0 scripts/build_phar.php
          php build/php-ini-audit.phar --root tests/fixtures/debian > /dev/null

  php-parity:
    name: Parity with PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["8.5"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # The official image has no composer, so dependencies are installed on the runner.
      - name: Install dependencies
        run: composer install --no-progress
      - name: Parity tests
        run: >-
          docker run --rm -v "$PWD":/app -w /app
          -e PHP_CGI=/usr/local/bin/php-cgi
          php:${{ matrix.php }}-cli
          vendor/bin/phpunit tests/PhpParityTest.php

  docker-images:
    name: Real PHP images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - name: Install dependencies
        run: composer install --no-progress
      - name: Scan official, Alpine and Debian images
        env:
          PHP_INI_AUDIT_DOCKER: "1"
        run: vendor/bin/phpunit tests/DockerImagesTest.php
