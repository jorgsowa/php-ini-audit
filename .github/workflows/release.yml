name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must be vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }
          current=$(php -r 'require "src/Version.php"; echo PhpIniAudit\Version::VERSION;')
          [[ "v$current" == "$TAG" ]] \
            || { echo "::error::src/Version.php has $current, tag is $TAG"; exit 1; }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          coverage: none
      - name: Install dependencies
        run: composer install --no-progress
      - name: Tests
        run: vendor/bin/phpunit --exclude-group parity

  # Holds the write token, so it runs only repository code: no third-party actions or Composer packages.
  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build PHAR
        run: |
          php -d phar.readonly=0 scripts/build_phar.php
          php build/php-ini-audit.phar --version | grep -qxF "php-ini-audit ${TAG#v}"
          (cd build && sha256sum php-ini-audit.phar > php-ini-audit.phar.sha256)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" build/php-ini-audit.phar build/php-ini-audit.phar.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
