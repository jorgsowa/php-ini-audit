[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "php-ini-audit"
version = "0.1.0"
description = "Static, read-only security audit of PHP INI configuration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["php", "php.ini", "security", "audit", "hardening", "php-fpm"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
php-ini-audit = "php_ini_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
