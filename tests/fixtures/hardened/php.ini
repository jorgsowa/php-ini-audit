[PHP]
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log
zend.exception_ignore_args = On
zend.assertions = -1
variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
enable_dl = Off
allow_url_fopen = Off
allow_url_include = Off
file_uploads = Off
max_execution_time = 30
memory_limit = 256M
open_basedir = /srv/app/:/var/lib/php/sessions/
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,putenv,mail,mb_send_mail,imap_mail,error_log,phpinfo
include_path = "/usr/share/php"
user_ini.filename =
session.save_path = /var/lib/php/sessions
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.name = APPSESSID
session.upload_progress.enabled = Off
cgi.fix_pathinfo = 0
opcache.restrict_api = /srv/app/admin/
opcache.validate_permission = 1
opcache.validate_root = 1
